<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ponti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f1;
  --surface: #ffffff;
  --border: #e4ddd3;
  --border-strong: #c8bfb2;
  --ink: #18160f;
  --ink-2: #5a5448;
  --ink-3: #9c9489;
  --accent: #c05a28;
  --accent-bg: #fdf0e8;
  --accent-border: #e8c4a4;
  --green: #2e7d56;
  --green-bg: #eaf4ef;
  --amber: #b07a10;
  --r: 14px;
  --r-sm: 9px;
  --fs: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: var(--fs); }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100dvh; }

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100dvh; }

/* ═══════════════════════════════
   SETUP SCREEN
═══════════════════════════════ */
#screen-setup {
  align-items: center;
  justify-content: center;
  padding: 1.5rem 1rem calc(1.5rem + var(--safe-bottom));
  background: var(--bg);
}

.setup-inner {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.brand {
  text-align: center;
  margin-bottom: 2.5rem;
}

.brand-name {
  font-family: 'Instrument Serif', serif;
  font-size: 3rem;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: -0.03em;
  line-height: 1;
}

.brand-name em { font-style: italic; color: var(--accent); }

.brand-tag {
  font-size: 0.8rem;
  color: var(--ink-3);
  margin-top: 0.4rem;
  font-style: italic;
  font-family: 'Instrument Serif', serif;
}

.setup-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 1.8rem 1.5rem;
  box-shadow: 0 2px 20px rgba(24,22,15,0.06);
}

.field { margin-bottom: 1.1rem; }

.field label {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-2);
  margin-bottom: 0.45rem;
}

.field input, .field select {
  width: 100%;
  padding: 0.75rem 0.9rem;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  color: var(--ink);
  background: var(--bg);
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s, background 0.15s;
}

.field input:focus, .field select:focus {
  border-color: var(--accent);
  background: #fff;
}

.field .hint {
  font-size: 0.72rem;
  color: var(--ink-3);
  margin-top: 0.3rem;
}

.sep { height: 1px; background: var(--border); margin: 1.4rem 0; }

.btn-start {
  width: 100%;
  padding: 0.9rem;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  letter-spacing: -0.01em;
}
.btn-start:hover { background: var(--accent); }

/* supabase section */
.supa-details summary {
  font-size: 0.75rem;
  color: var(--ink-3);
  cursor: pointer;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.2rem 0;
  margin-bottom: 0.8rem;
}
.supa-details summary::before { content: '⚙'; font-size: 0.8rem; }
.supa-details[open] summary::before { content: '✕'; }
.supa-details summary:hover { color: var(--ink-2); }

.user-id-note {
  margin-top: 1rem;
  padding: 0.65rem 0.9rem;
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-sm);
  font-size: 0.72rem;
  color: var(--ink-2);
  line-height: 1.5;
}

.user-id-note strong {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--accent);
  font-family: monospace;
  letter-spacing: 0.05em;
}

/* ═══════════════════════════════
   CHAT SCREEN
═══════════════════════════════ */
#screen-chat { height: 100dvh; overflow: hidden; }

/* Header */
.chat-top {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.65rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.top-left { display: flex; align-items: center; gap: 0.6rem; }

.logo-xs {
  font-family: 'Instrument Serif', serif;
  font-size: 1.2rem;
  color: var(--ink);
  line-height: 1;
}
.logo-xs em { font-style: italic; color: var(--accent); }

.session-chip {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.18rem 0.6rem;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: 0.06em;
}

.conn-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border-strong);
  flex-shrink: 0;
  transition: background 0.3s;
}
.conn-dot.ok { background: var(--green); }
.conn-dot.wait { background: var(--amber); animation: blink 1.4s infinite; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.top-right { display: flex; align-items: center; gap: 0.5rem; }

.who-pill {
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 20px;
  padding: 0.2rem 0.65rem;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.lang-tag {
  font-size: 0.6rem;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  border-radius: 4px;
  padding: 0.05rem 0.3rem;
  letter-spacing: 0.04em;
}

.btn-settings {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--ink-2);
  transition: all 0.15s;
}
.btn-settings:hover { border-color: var(--ink-2); color: var(--ink); }

/* Messages area */
.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  overscroll-behavior: contain;
}

.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  gap: 0.6rem;
  padding: 2rem;
  text-align: center;
}
.empty-glyph { font-size: 2.2rem; opacity: 0.35; }
.empty-txt { font-size: 0.9rem; }

/* Bubbles */
.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 76%;
  animation: popIn 0.2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.92) translateY(6px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

.msg-row.mine { align-self: flex-end; align-items: flex-end; }
.msg-row.theirs { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 0.7rem 1rem;
  border-radius: 18px;
  font-size: 0.95rem;
  line-height: 1.55;
  word-break: break-word;
}

.mine .bubble {
  background: var(--ink);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.theirs .bubble {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--ink);
  border-bottom-left-radius: 4px;
}

.equiv {
  font-size: 0.7rem;
  color: var(--accent);
  font-style: italic;
  margin-top: 0.2rem;
  padding: 0 0.3rem;
}

.msg-meta {
  font-size: 0.66rem;
  color: var(--ink-3);
  margin-top: 0.25rem;
  padding: 0 0.3rem;
}

/* ── COMPOSER ── */
.composer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  padding-bottom: calc(0.2rem + var(--safe-bottom));
}

/* Category pills */
.cat-row {
  display: flex;
  gap: 0.35rem;
  padding: 0.7rem 0.9rem 0.4rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.cat-row::-webkit-scrollbar { display: none; }

.cat-pill {
  flex-shrink: 0;
  padding: 0.3rem 0.75rem;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  font-size: 0.75rem;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.13s;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.cat-pill:hover { border-color: var(--accent-border); color: var(--accent); }
.cat-pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Messages grid */
.msg-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4rem;
  padding: 0.3rem 0.9rem 0.6rem;
  max-height: 200px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
@media (max-width: 360px) { .msg-grid { grid-template-columns: 1fr; max-height: 160px; } }

.msg-btn {
  padding: 0.55rem 0.7rem;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--border);
  background: var(--bg);
  font-size: 0.8rem;
  color: var(--ink-2);
  cursor: pointer;
  text-align: left;
  line-height: 1.4;
  transition: all 0.13s;
  font-family: 'Inter', sans-serif;
}
.msg-btn:hover { border-color: var(--accent-border); background: var(--accent-bg); color: var(--ink); }
.msg-btn.sel { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 500; }

/* Send bar */
.send-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.9rem 0.5rem;
  border-top: 1px solid var(--border);
}

.preview-text {
  flex: 1;
  font-size: 0.85rem;
  color: var(--ink-3);
  font-style: italic;
  padding: 0.45rem 0.75rem;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--border);
  background: var(--bg);
  min-height: 40px;
  display: flex;
  align-items: center;
  transition: all 0.13s;
}
.preview-text.ready {
  color: var(--ink);
  font-style: normal;
  background: var(--surface);
  border-color: var(--accent-border);
}

.btn-send {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--ink);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
.btn-send:hover:not(:disabled) { background: var(--accent); }
.btn-send:active:not(:disabled) { transform: scale(0.92); }
.btn-send:disabled { background: var(--border); cursor: not-allowed; }
.btn-send svg { fill: white; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: calc(1.5rem + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink);
  color: #fff;
  padding: 0.55rem 1.1rem;
  border-radius: 20px;
  font-size: 0.8rem;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  transition: all 0.25s;
  max-width: calc(100vw - 2rem);
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── CONN PANEL ── */
.conn-panel {
  position: fixed;
  top: 0.8rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: calc(100% - 1.6rem);
  max-width: 360px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  box-shadow: 0 6px 24px rgba(24,22,15,0.11);
  padding: 0.8rem 1rem;
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  transition: opacity 0.35s, transform 0.35s;
}
.conn-panel.hide { opacity:0; transform:translateX(-50%) translateY(-10px); pointer-events:none; }
.conn-panel-ico { font-size: 1.2rem; flex-shrink:0; margin-top:0.1rem; }
.conn-panel-body { flex:1; }
.conn-panel-title { font-size: 0.78rem; font-weight: 600; color: var(--ink); }
.conn-panel-msg { font-size: 0.7rem; color: var(--ink-3); margin-top: 0.15rem; font-family: monospace; word-break: break-word; }
.conn-panel-retry {
  margin-top: 0.5rem; font-size: 0.72rem; padding: 0.25rem 0.7rem;
  border-radius: 20px; border: 1.5px solid var(--border); background: var(--bg);
  cursor: pointer; color: var(--ink-2); display: none; transition: all 0.13s;
  font-family: 'Inter', sans-serif;
}
.conn-panel-retry:hover { border-color: var(--accent); color: var(--accent); }
.conn-panel.loading { border-left: 3px solid var(--amber); }
.conn-panel.connected { border-left: 3px solid var(--green); }
.conn-panel.error_config, .conn-panel.error_network { border-left: 3px solid var(--accent); }
.conn-panel.connected .conn-panel-title { color: var(--green); }
.conn-panel.error_config .conn-panel-title,
.conn-panel.error_network .conn-panel-title { color: var(--accent); }
</style>
</head>
<body>

<!-- ══════════════════════════════
     SETUP
══════════════════════════════ -->
<div id="screen-setup" class="screen active">
  <div class="setup-inner">

    <div class="brand">
      <div class="brand-name">P<em>o</em>nti</div>
      <div class="brand-tag" id="brand-tag">Des ponts, pas des murs.</div>
    </div>

    <div class="setup-card">
      <div class="field">
        <label id="lbl-name">Votre prénom</label>
        <input type="text" id="inp-name" placeholder="…" maxlength="32" autocomplete="given-name">
      </div>

      <div class="field">
        <label id="lbl-lang">Langue</label>
        <select id="inp-lang" onchange="applyLang()">
          <option value="fr">🇫🇷 Français</option>
          <option value="en">🇬🇧 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="zh">🇨🇳 普通话</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="fa">🇮🇷 فارسی</option>
        </select>
      </div>

      <div class="field">
        <label id="lbl-conv">Code de session</label>
        <input type="text" id="inp-conv" placeholder="CO0235" maxlength="8"
               style="letter-spacing:0.12em;text-transform:uppercase;font-weight:600"
               oninput="this.value=this.value.toUpperCase()">
        <div class="hint" id="hint-conv">Le code partagé avec votre interlocuteur·rice.</div>
      </div>

      <div class="sep"></div>

      <button class="btn-start" id="btn-start" onclick="startChat()">Commencer →</button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════
     CHAT
══════════════════════════════ -->
<div id="screen-chat" class="screen">

  <div class="chat-top">
    <div class="top-left">
      <div class="logo-xs">P<em>o</em>nti</div>
      <div class="session-chip" id="sess-badge">—</div>
      <div class="conn-dot wait" id="conn-dot"></div>
    </div>
    <div class="top-right">
      <div class="who-pill">
        <div class="lang-tag" id="who-lang">FR</div>
        <span id="who-name">—</span>
      </div>
      <button class="btn-settings" onclick="goSetup()" title="Paramètres">⚙</button>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="empty-state" id="empty-state">
      <div class="empty-glyph">🌐</div>
      <div class="empty-txt" id="empty-txt">En attente de connexion…</div>
    </div>
  </div>

  <div class="composer">
    <div class="cat-row" id="cat-row"></div>
    <div class="msg-grid" id="msg-grid"></div>
    <div class="send-bar">
      <div class="preview-text" id="preview"><span id="preview-txt">Sélectionnez un message…</span></div>
      <button class="btn-send" id="btn-send" disabled onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- CONN PANEL -->
<div class="conn-panel loading hide" id="conn-panel">
  <div class="conn-panel-ico" id="conn-ico">⏳</div>
  <div class="conn-panel-body">
    <div class="conn-panel-title" id="conn-title">Connexion…</div>
    <div class="conn-panel-msg" id="conn-msg"></div>
    <button class="conn-panel-retry" id="conn-retry" onclick="setupPolling()">↺ Réessayer</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

const UI = {

  fa:{ name:"نام شما", lang:"زبان", conv:"کد جلسه", hintConv:"کد مشترک با طرف مقابل.", start:"شروع →", emptyWait:"در انتظار اتصال…", emptyReady:"یک پیام برای ارسال انتخاب کنید.", statusWaiting:"در انتظار…", statusOk:"متصل", placeholder:"یک پیام انتخاب کنید…", youSent:"شما", tag:"پل، نه دیوار.", supa:"تنظیمات Supabase" }
};

/* ══════════════════════════════
   MESSAGE LIBRARY (identical to V1)
══════════════════════════════ */
const MSG = {
  fr: [
    { cat:"👋 Salutations", items:[{id:"g01",t:"Bonjour, je suis content·e qu'on se parle."},{id:"g02",t:"Bonsoir ! Comment tu vas ?"},{id:"g03",t:"Ça fait plaisir de te retrouver."},{id:"g04",t:"Je pense à toi."},{id:"g05",t:"Comment s'est passée ta journée ?"},{id:"g06",t:"Tu as l'air occupé·e, on peut parler plus tard."},{id:"g07",t:"Je voulais juste te saluer."},{id:"g08",t:"Tu es libre pour discuter ?"},{id:"g09",t:"J'espère que tu vas bien."},{id:"g10",t:"Longtemps qu'on ne s'est pas parlé !"},{id:"g11",t:"Je t'envoie une pensée chaleureuse."},{id:"g12",t:"Bonne nuit, à bientôt."}]},
    { cat:"😊 Bien-être", items:[{id:"w01",t:"Je vais bien, merci de demander."},{id:"w02",t:"Je suis fatigué·e en ce moment."},{id:"w03",t:"Ça va plutôt bien aujourd'hui."},{id:"w04",t:"J'ai eu une journée difficile."},{id:"w05",t:"Je me sens en forme !"},{id:"w06",t:"Je suis un peu stressé·e."},{id:"w07",t:"Je traverse une période compliquée."},{id:"w08",t:"Tout va bien, ne t'inquiète pas."},{id:"w09",t:"J'ai besoin de me reposer."},{id:"w10",t:"Je suis heureux·se en ce moment."},{id:"w11",t:"Je manque d'énergie ces derniers temps."},{id:"w12",t:"Je me sens calme et serein·e."}]},
    { cat:"🤝 Connexion", items:[{id:"c01",t:"J'aimerais qu'on se voit bientôt."},{id:"c02",t:"Notre échange compte beaucoup pour moi."},{id:"c03",t:"Je t'apprécie vraiment."},{id:"c04",t:"J'ai pensé à toi aujourd'hui."},{id:"c05",t:"Tu m'as manqué·e."},{id:"c06",t:"Je suis là si tu as besoin."},{id:"c07",t:"Je voudrais mieux te connaître."},{id:"c08",t:"Tu peux compter sur moi."},{id:"c09",t:"Nos différences m'enrichissent."},{id:"c10",t:"Je suis content·e qu'on soit en contact."},{id:"c11",t:"J'ai hâte de partager plus avec toi."},{id:"c12",t:"Cette amitié est précieuse pour moi."}]},
    { cat:"📅 Organisation", items:[{id:"o01",t:"On pourrait se retrouver quand ?"},{id:"o02",t:"Je suis libre ce week-end."},{id:"o03",t:"Je ne suis pas disponible en ce moment."},{id:"o04",t:"On reporte à une autre fois ?"},{id:"o05",t:"Quel moment te convient le mieux ?"},{id:"o06",t:"Je confirme notre rendez-vous."},{id:"o07",t:"Je dois annuler, je suis désolé·e."},{id:"o08",t:"Tu préfères qu'on se retrouve où ?"},{id:"o09",t:"Je serai là à l'heure."},{id:"o10",t:"Je risque d'avoir du retard."},{id:"o11",t:"C'est parfait pour moi."},{id:"o12",t:"Je vais voir et je te reviens."}]},
    { cat:"💬 Échange", items:[{id:"e01",t:"Je ne comprends pas tout à fait, tu peux reformuler ?"},{id:"e02",t:"C'est intéressant ce que tu dis."},{id:"e03",t:"Je suis d'accord avec toi."},{id:"e04",t:"Je vois les choses différemment."},{id:"e05",t:"Tu as raison."},{id:"e06",t:"J'y réfléchis."},{id:"e07",t:"C'est une bonne idée."},{id:"e08",t:"Je ne suis pas sûr·e."},{id:"e09",t:"Raconte-moi plus."},{id:"e10",t:"Je comprends ce que tu veux dire."},{id:"e11",t:"Ça me fait réfléchir."},{id:"e12",t:"Je te fais confiance sur ce point."}]},
    { cat:"🌍 Cultures", items:[{id:"k01",t:"J'aimerais en savoir plus sur ta culture."},{id:"k02",t:"Chez moi, on a l'habitude de faire autrement."},{id:"k03",t:"Je découvre quelque chose de nouveau grâce à toi."},{id:"k04",t:"C'est différent de ce que je connais, et c'est bien."},{id:"k05",t:"Quelle est ta tradition préférée ?"},{id:"k06",t:"La nourriture de ton pays me fascine."},{id:"k07",t:"Comment dit-on « merci » dans ta langue ?"},{id:"k08",t:"Nos cultures se ressemblent sur ce point."},{id:"k09",t:"J'admire la façon dont tu vois le monde."},{id:"k10",t:"Tu m'as appris quelque chose aujourd'hui."},{id:"k11",t:"Je veux comprendre, pas juger."},{id:"k12",t:"La diversité nous rend plus riches."}]},
    { cat:"❤️ Gratitude", items:[{id:"t01",t:"Merci pour tout."},{id:"t02",t:"Tu as été d'une grande aide."},{id:"t03",t:"Je t'en suis très reconnaissant·e."},{id:"t04",t:"Ton soutien compte beaucoup."},{id:"t05",t:"C'était exactement ce dont j'avais besoin."},{id:"t06",t:"Je n'oublierai pas ce geste."},{id:"t07",t:"Tu es quelqu'un de précieux·se pour moi."},{id:"t08",t:"Merci d'être là."},{id:"t09",t:"Ça m'a vraiment touché·e."},{id:"t10",t:"Je voudrais te rendre la pareille."},{id:"t11",t:"Tu mérites d'être remercié·e."},{id:"t12",t:"Ta gentillesse change tout."}]},
    { cat:"🙏 Soutien", items:[{id:"s01",t:"Je suis là pour toi."},{id:"s02",t:"Tu n'es pas seul·e."},{id:"s03",t:"Prends soin de toi."},{id:"s04",t:"Je pense à toi dans cette épreuve."},{id:"s05",t:"Ça va s'arranger, j'en suis sûr·e."},{id:"s06",t:"Tu peux me parler si tu veux."},{id:"s07",t:"Je te souhaite de la force."},{id:"s08",t:"Tu es plus fort·e que tu ne le crois."},{id:"s09",t:"On traversera ça ensemble."},{id:"s10",t:"J'admire ta résilience."},{id:"s11",t:"Reste positif·ve, même si c'est dur."},{id:"s12",t:"Je suis fier·fière de toi."}]},
    { cat:"🎉 Joie", items:[{id:"j01",t:"Quelle bonne nouvelle !"},{id:"j02",t:"Je suis tellement content·e pour toi."},{id:"j03",t:"Il faut fêter ça !"},{id:"j04",t:"Tu le mérites vraiment."},{id:"j05",t:"Je partage ta joie."},{id:"j06",t:"C'est une excellente nouvelle."},{id:"j07",t:"Ça m'a fait sourire d'apprendre ça."},{id:"j08",t:"Félicitations !"},{id:"j09",t:"C'est un moment important."},{id:"j10",t:"Je voulais que tu saches : tu as bien fait."},{id:"j11",t:"Tu rayonnes !"},{id:"j12",t:"Continuons sur cette lancée."}]},
    { cat:"🌙 Pause", items:[{id:"p01",t:"Je dois y aller, à très vite."},{id:"p02",t:"On continue cette conversation plus tard ?"},{id:"p03",t:"Je serai absent·e quelques jours, je reviendrai."},{id:"p04",t:"Je t'écrirai quand j'aurai plus de temps."},{id:"p05",t:"Je suis en déplacement cette semaine."},{id:"p06",t:"Je te souhaite une bonne continuation."},{id:"p07",t:"Je prends un peu de recul."},{id:"p08",t:"Ne t'inquiète pas si je mets du temps à répondre."},{id:"p09",t:"Je reviens bientôt."},{id:"p10",t:"On se reparle très vite."},{id:"p11",t:"Prends soin de toi d'ici là."},{id:"p12",t:"Je reste joignable si c'est urgent."}]}

  en: [
    { cat:"👋 Greetings", items:[{id:"g01",t:"Hello, I'm glad we're talking."},{id:"g02",t:"Good evening! How are you?"},{id:"g03",t:"It's good to catch up with you."},{id:"g04",t:"I'm thinking of you."},{id:"g05",t:"How was your day?"},{id:"g06",t:"You seem busy, we can talk later."},{id:"g07",t:"I just wanted to say hi."},{id:"g08",t:"Are you free to chat?"},{id:"g09",t:"I hope you're doing well."},{id:"g10",t:"It's been a while since we last talked!"},{id:"g11",t:"Sending you warm thoughts."},{id:"g12",t:"Good night, talk soon."}]},
    { cat:"😊 Well-being", items:[{id:"w01",t:"I'm doing well, thanks for asking."},{id:"w02",t:"I'm a bit tired these days."},{id:"w03",t:"Things are pretty good today."},{id:"w04",t:"I had a tough day."},{id:"w05",t:"I'm feeling great!"},{id:"w06",t:"I'm a little stressed."},{id:"w07",t:"I'm going through a complicated time."},{id:"w08",t:"Everything's fine, don't worry."},{id:"w09",t:"I need some rest."},{id:"w10",t:"I'm happy right now."},{id:"w11",t:"I've been low on energy lately."},{id:"w12",t:"I feel calm and at peace."}]},
    { cat:"🤝 Connection", items:[{id:"c01",t:"I'd love for us to meet up soon."},{id:"c02",t:"Our exchanges mean a lot to me."},{id:"c03",t:"I really appreciate you."},{id:"c04",t:"I thought of you today."},{id:"c05",t:"I've missed you."},{id:"c06",t:"I'm here if you need me."},{id:"c07",t:"I'd like to get to know you better."},{id:"c08",t:"You can count on me."},{id:"c09",t:"Our differences enrich me."},{id:"c10",t:"I'm glad we're in touch."},{id:"c11",t:"I look forward to sharing more with you."},{id:"c12",t:"This friendship is precious to me."}]},
    { cat:"📅 Planning", items:[{id:"o01",t:"When could we meet?"},{id:"o02",t:"I'm free this weekend."},{id:"o03",t:"I'm not available right now."},{id:"o04",t:"Shall we reschedule?"},{id:"o05",t:"What time works best for you?"},{id:"o06",t:"I confirm our meeting."},{id:"o07",t:"I have to cancel, I'm sorry."},{id:"o08",t:"Where would you prefer to meet?"},{id:"o09",t:"I'll be there on time."},{id:"o10",t:"I might be running late."},{id:"o11",t:"That works perfectly for me."},{id:"o12",t:"Let me check and get back to you."}]},
    { cat:"💬 Dialogue", items:[{id:"e01",t:"I don't quite understand, could you rephrase?"},{id:"e02",t:"That's interesting what you're saying."},{id:"e03",t:"I agree with you."},{id:"e04",t:"I see things a bit differently."},{id:"e05",t:"You're right."},{id:"e06",t:"I'll think about it."},{id:"e07",t:"That's a good idea."},{id:"e08",t:"I'm not sure."},{id:"e09",t:"Tell me more."},{id:"e10",t:"I understand what you mean."},{id:"e11",t:"That gives me something to think about."},{id:"e12",t:"I trust you on this."}]},
    { cat:"🌍 Cultures", items:[{id:"k01",t:"I'd love to learn more about your culture."},{id:"k02",t:"Back home, we usually do things differently."},{id:"k03",t:"I'm discovering something new thanks to you."},{id:"k04",t:"It's different from what I know, and that's great."},{id:"k05",t:"What's your favourite tradition?"},{id:"k06",t:"The food from your country fascinates me."},{id:"k07",t:"How do you say 'thank you' in your language?"},{id:"k08",t:"Our cultures are similar in this way."},{id:"k09",t:"I admire the way you see the world."},{id:"k10",t:"You taught me something today."},{id:"k11",t:"I want to understand, not judge."},{id:"k12",t:"Diversity makes us richer."}]},
    { cat:"❤️ Gratitude", items:[{id:"t01",t:"Thank you for everything."},{id:"t02",t:"You've been a great help."},{id:"t03",t:"I'm very grateful to you."},{id:"t04",t:"Your support means a lot."},{id:"t05",t:"That was exactly what I needed."},{id:"t06",t:"I won't forget this gesture."},{id:"t07",t:"You are someone precious to me."},{id:"t08",t:"Thank you for being here."},{id:"t09",t:"That really touched me."},{id:"t10",t:"I'd love to return the favour."},{id:"t11",t:"You deserve to be thanked."},{id:"t12",t:"Your kindness changes everything."}]},
    { cat:"🙏 Support", items:[{id:"s01",t:"I'm here for you."},{id:"s02",t:"You're not alone."},{id:"s03",t:"Take care of yourself."},{id:"s04",t:"I'm thinking of you in this difficult time."},{id:"s05",t:"It will get better, I'm sure of it."},{id:"s06",t:"You can talk to me if you want."},{id:"s07",t:"I wish you strength."},{id:"s08",t:"You're stronger than you think."},{id:"s09",t:"We'll get through this together."},{id:"s10",t:"I admire your resilience."},{id:"s11",t:"Stay positive, even when it's hard."},{id:"s12",t:"I'm proud of you."}]},
    { cat:"🎉 Joy", items:[{id:"j01",t:"What great news!"},{id:"j02",t:"I'm so happy for you."},{id:"j03",t:"We should celebrate!"},{id:"j04",t:"You really deserve it."},{id:"j05",t:"I share your joy."},{id:"j06",t:"That's excellent news."},{id:"j07",t:"That made me smile."},{id:"j08",t:"Congratulations!"},{id:"j09",t:"This is an important moment."},{id:"j10",t:"I want you to know: you did the right thing."},{id:"j11",t:"You're shining!"},{id:"j12",t:"Let's keep this momentum going."}]},
    { cat:"🌙 Pause", items:[{id:"p01",t:"I have to go, talk very soon."},{id:"p02",t:"Shall we continue this conversation later?"},{id:"p03",t:"I'll be away for a few days, I'll be back."},{id:"p04",t:"I'll write when I have more time."},{id:"p05",t:"I'm travelling this week."},{id:"p06",t:"I wish you all the best."},{id:"p07",t:"I'm taking a little step back."},{id:"p08",t:"Don't worry if I take time to reply."},{id:"p09",t:"I'll be back soon."},{id:"p10",t:"We'll talk again very soon."},{id:"p11",t:"Take care of yourself until then."},{id:"p12",t:"I'm reachable if it's urgent."}]}

  es: [
    { cat:"👋 Saludos", items:[{id:"g01",t:"Hola, me alegra que hablemos."},{id:"g02",t:"¡Buenas noches! ¿Cómo estás?"},{id:"g03",t:"Es genial verte de nuevo."},{id:"g04",t:"Estoy pensando en ti."},{id:"g05",t:"¿Cómo fue tu día?"},{id:"g06",t:"Pareces ocupado/a, podemos hablar después."},{id:"g07",t:"Solo quería saludarte."},{id:"g08",t:"¿Tienes tiempo para charlar?"},{id:"g09",t:"Espero que estés bien."},{id:"g10",t:"¡Hace mucho que no hablamos!"},{id:"g11",t:"Te mando un pensamiento cálido."},{id:"g12",t:"Buenas noches, hasta pronto."}]},
    { cat:"😊 Bienestar", items:[{id:"w01",t:"Estoy bien, gracias por preguntar."},{id:"w02",t:"Estoy un poco cansado/a últimamente."},{id:"w03",t:"Hoy las cosas van bastante bien."},{id:"w04",t:"Tuve un día difícil."},{id:"w05",t:"¡Me siento genial!"},{id:"w06",t:"Estoy algo estresado/a."},{id:"w07",t:"Estoy pasando un momento complicado."},{id:"w08",t:"Todo va bien, no te preocupes."},{id:"w09",t:"Necesito descansar."},{id:"w10",t:"Soy feliz en este momento."},{id:"w11",t:"He tenido poca energía últimamente."},{id:"w12",t:"Me siento tranquilo/a y sereno/a."}]},
    { cat:"🤝 Conexión", items:[{id:"c01",t:"Me encantaría que nos viéramos pronto."},{id:"c02",t:"Nuestros intercambios significan mucho para mí."},{id:"c03",t:"Te aprecio de verdad."},{id:"c04",t:"Hoy pensé en ti."},{id:"c05",t:"Te he echado de menos."},{id:"c06",t:"Estoy aquí si me necesitas."},{id:"c07",t:"Me gustaría conocerte mejor."},{id:"c08",t:"Puedes contar conmigo."},{id:"c09",t:"Nuestras diferencias me enriquecen."},{id:"c10",t:"Me alegra que estemos en contacto."},{id:"c11",t:"Espero compartir más contigo."},{id:"c12",t:"Esta amistad es muy valiosa para mí."}]},
    { cat:"📅 Organización", items:[{id:"o01",t:"¿Cuándo podríamos vernos?"},{id:"o02",t:"Estoy libre este fin de semana."},{id:"o03",t:"Ahora mismo no estoy disponible."},{id:"o04",t:"¿Aplazamos para otro momento?"},{id:"o05",t:"¿Qué momento te va mejor?"},{id:"o06",t:"Confirmo nuestra cita."},{id:"o07",t:"Tengo que cancelar, lo siento."},{id:"o08",t:"¿Dónde prefieres que nos veamos?"},{id:"o09",t:"Estaré allí a tiempo."},{id:"o10",t:"Es posible que llegue tarde."},{id:"o11",t:"Me va perfecto."},{id:"o12",t:"Lo miro y te digo."}]},
    { cat:"💬 Diálogo", items:[{id:"e01",t:"No lo entiendo del todo, ¿puedes reformularlo?"},{id:"e02",t:"Es interesante lo que dices."},{id:"e03",t:"Estoy de acuerdo contigo."},{id:"e04",t:"Yo lo veo de otra manera."},{id:"e05",t:"Tienes razón."},{id:"e06",t:"Lo estoy pensando."},{id:"e07",t:"Es una buena idea."},{id:"e08",t:"No estoy seguro/a."},{id:"e09",t:"Cuéntame más."},{id:"e10",t:"Entiendo lo que quieres decir."},{id:"e11",t:"Eso me da que pensar."},{id:"e12",t:"Confío en ti en este punto."}]},
    { cat:"🌍 Culturas", items:[{id:"k01",t:"Me gustaría saber más sobre tu cultura."},{id:"k02",t:"En mi casa solemos hacerlo de otra manera."},{id:"k03",t:"Gracias a ti descubro algo nuevo."},{id:"k04",t:"Es diferente a lo que conozco, y eso es bueno."},{id:"k05",t:"¿Cuál es tu tradición favorita?"},{id:"k06",t:"La comida de tu país me fascina."},{id:"k07",t:"¿Cómo se dice «gracias» en tu idioma?"},{id:"k08",t:"Nuestras culturas se parecen en esto."},{id:"k09",t:"Admiro tu manera de ver el mundo."},{id:"k10",t:"Hoy me has enseñado algo."},{id:"k11",t:"Quiero entender, no juzgar."},{id:"k12",t:"La diversidad nos enriquece."}]},
    { cat:"❤️ Gratitud", items:[{id:"t01",t:"Gracias por todo."},{id:"t02",t:"Has sido de gran ayuda."},{id:"t03",t:"Te lo agradezco mucho."},{id:"t04",t:"Tu apoyo significa mucho."},{id:"t05",t:"Era justo lo que necesitaba."},{id:"t06",t:"No olvidaré este gesto."},{id:"t07",t:"Eres alguien muy valioso/a para mí."},{id:"t08",t:"Gracias por estar aquí."},{id:"t09",t:"Eso me llegó al corazón."},{id:"t10",t:"Me gustaría devolvértelo."},{id:"t11",t:"Te mereces que te den las gracias."},{id:"t12",t:"Tu amabilidad lo cambia todo."}]},
    { cat:"🙏 Apoyo", items:[{id:"s01",t:"Aquí estoy para ti."},{id:"s02",t:"No estás solo/a."},{id:"s03",t:"Cuídate."},{id:"s04",t:"Pienso en ti en este momento difícil."},{id:"s05",t:"Mejorará, estoy seguro/a."},{id:"s06",t:"Puedes hablar conmigo si quieres."},{id:"s07",t:"Te deseo fuerzas."},{id:"s08",t:"Eres más fuerte de lo que crees."},{id:"s09",t:"Lo superaremos juntos."},{id:"s10",t:"Admiro tu resiliencia."},{id:"s11",t:"Mantén la positividad, aunque sea difícil."},{id:"s12",t:"Estoy orgulloso/a de ti."}]},
    { cat:"🎉 Alegría", items:[{id:"j01",t:"¡Qué gran noticia!"},{id:"j02",t:"Estoy muy feliz por ti."},{id:"j03",t:"¡Hay que celebrarlo!"},{id:"j04",t:"Te lo mereces."},{id:"j05",t:"Comparto tu alegría."},{id:"j06",t:"Es una noticia excelente."},{id:"j07",t:"Me alegró saberlo."},{id:"j08",t:"¡Felicitaciones!"},{id:"j09",t:"Es un momento importante."},{id:"j10",t:"Quiero que sepas: hiciste lo correcto."},{id:"j11",t:"¡Estás brillando!"},{id:"j12",t:"Sigamos con este impulso."}]},
    { cat:"🌙 Pausa", items:[{id:"p01",t:"Tengo que irme, hasta muy pronto."},{id:"p02",t:"¿Continuamos esta conversación después?"},{id:"p03",t:"Estaré fuera unos días, ya vuelvo."},{id:"p04",t:"Te escribiré cuando tenga más tiempo."},{id:"p05",t:"Esta semana estoy de viaje."},{id:"p06",t:"Te deseo lo mejor."},{id:"p07",t:"Voy a tomar un poco de distancia."},{id:"p08",t:"No te preocupes si tardo en responder."},{id:"p09",t:"Vuelvo pronto."},{id:"p10",t:"Hablamos muy pronto."},{id:"p11",t:"Cuídate hasta entonces."},{id:"p12",t:"Sigo disponible si es urgente."}]}

    { cat:"🤝 联系", items:[{id:"c01",t:"希望我们能尽快见面。"},{id:"c02",t:"我们的交流对我非常重要。"},{id:"c03",t:"我真的很欣赏你。"},{id:"c04",t:"今天我想到你了。"},{id:"c05",t:"我想念你。"},{id:"c06",t:"如果你需要我，我在这里。"},{id:"c07",t:"我想更了解你。"},{id:"c08",t:"你可以依靠我。"},{id:"c09",t:"我们的差异让我更丰富。"},{id:"c10",t:"很高兴我们保持联系。"},{id:"c11",t:"我期待与你分享更多。"},{id:"c12",t:"这份友谊对我很宝贵。"}]},

/* ══════════════════════════════
   SUPABASE CONFIG — À REMPLIR ICI
══════════════════════════════ */
let SUPA_URL = 'https://nzsxcpmzlrznrpasnonc.supabase.co';      // ← remplacer par https://xxxx.supabase.co
let SUPA_KEY = 'sb_publishable_9DsidpyHkHOI3hf8fGwN7Q_uUpWdkDI'; // ← remplacer par la clé anon JWT (eyJ…)

/* ══════════════════════════════
   STATE

   ⚠️ userId est TOUJOURS lu depuis sessionStorage (propre à chaque onglet),
   jamais depuis localStorage — c'est ce qui garantit qu'ouvrir 2 fenêtres
   sur la même machine donne 2 identités distinctes.
══════════════════════════════ */
const STATE = {
  lang: 'fr', name: '', conv: '',
  userId: null,       // généré au boot, stocké dans sessionStorage
  selectedMsg: null, selectedCat: 0,
  supaClient: null, pollInterval: null,
  lastMsgId: 0, fontSize: 16
};

function genId() { return 'U' + Math.random().toString(36).slice(2, 10).toUpperCase(); }

function boot() {
  // 1. Lire les préférences persistantes (nom, langue, conv) depuis localStorage
  try {
    const s = JSON.parse(localStorage.getItem('ponti_prefs') || '{}');
    if (s.lang)     STATE.lang     = s.lang;
    if (s.name)     STATE.name     = s.name;
    if (s.conv)     STATE.conv     = s.conv;
    if (s.fontSize) STATE.fontSize = s.fontSize;
    // Récupérer les URL/KEY éventuellement sauvegardés
  } catch(e) {}

  // 2. userId EXCLUSIVEMENT dans sessionStorage → unique par onglet
  let uid = sessionStorage.getItem('ponti_uid');
  if (!uid) { uid = genId(); sessionStorage.setItem('ponti_uid', uid); }
  STATE.userId = uid;

  // Afficher l'UID dans l'écran setup (pour info)

  // Pré-remplir les champs
  document.getElementById('inp-name').value = STATE.name;
  document.getElementById('inp-lang').value = STATE.lang;
  document.getElementById('inp-conv').value = STATE.conv;
  document.documentElement.style.setProperty('--fs', STATE.fontSize + 'px');
  applyLang();
}

function savePrefs() {
  localStorage.setItem('ponti_prefs', JSON.stringify({
    lang: STATE.lang, name: STATE.name, conv: STATE.conv,
    fontSize: STATE.fontSize
  }));
}

/* ══════════════════════════════
   LANG
══════════════════════════════ */
function applyLang() {
  const lang = document.getElementById('inp-lang').value;
  STATE.lang = lang;
  const t = UI[lang];
  const rtl = ['ar','fa'].includes(lang);
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.documentElement.lang = lang;
  document.getElementById('lbl-name').textContent = t.name;
  document.getElementById('lbl-lang').textContent = t.lang;
  document.getElementById('lbl-conv').textContent = t.conv;
  document.getElementById('hint-conv').textContent = t.hintConv;
  document.getElementById('brand-tag').textContent = t.tag;
  document.getElementById('btn-start').textContent = t.start;
}

/* ══════════════════════════════
   SETUP → CHAT
══════════════════════════════ */
function startChat() {
  const name = document.getElementById('inp-name').value.trim();
  const conv = document.getElementById('inp-conv').value.trim().toUpperCase();
  if (!name) { toast('⚠ ' + (STATE.lang==='fr' ? 'Entrez votre prénom.' : 'Enter your name.')); return; }
  if (!conv || conv.length < 2) { toast('⚠ ' + (STATE.lang==='fr' ? 'Code de session requis.' : 'Session code required.')); return; }
  STATE.name = name; STATE.conv = conv;
  savePrefs();
  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-chat').classList.add('active');
  initChat();
}

function goSetup() {
  if (STATE.pollInterval) { clearInterval(STATE.pollInterval); STATE.pollInterval = null; }
  document.getElementById('screen-chat').classList.remove('active');
  document.getElementById('screen-setup').classList.add('active');
  document.getElementById('inp-name').value = STATE.name;
  document.getElementById('inp-lang').value = STATE.lang;
  document.getElementById('inp-conv').value = STATE.conv;
  applyLang();
}

function initChat() {
  const rtl = ['ar','fa'].includes(STATE.lang);
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.getElementById('sess-badge').textContent = STATE.conv;
  document.getElementById('who-name').textContent = STATE.name;
  document.getElementById('who-lang').textContent = STATE.lang.toUpperCase();
  document.getElementById('empty-txt').textContent = UI[STATE.lang].emptyWait;
  buildCats();
  setupPolling();
}

/* ══════════════════════════════
   CATEGORIES + MESSAGES
══════════════════════════════ */
function buildCats() {
  const cats = MSG[STATE.lang] || MSG.fr;
  const row = document.getElementById('cat-row');
  row.innerHTML = '';
  cats.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (i === STATE.selectedCat ? ' on' : '');
    btn.textContent = c.cat;
    btn.onclick = () => selectCat(i);
    row.appendChild(btn);
  });
  selectCat(STATE.selectedCat);
}

function selectCat(i) {
  STATE.selectedCat = i; STATE.selectedMsg = null; updatePreview();
  document.querySelectorAll('.cat-pill').forEach((p, j) => p.classList.toggle('on', j===i));
  const cats = MSG[STATE.lang] || MSG.fr;
  const grid = document.getElementById('msg-grid');
  grid.innerHTML = '';
  cats[i].items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'msg-btn'; btn.textContent = item.t; btn.dataset.id = item.id;
    btn.onclick = () => pickMsg(item, btn);
    grid.appendChild(btn);
  });
}

function pickMsg(item, el) {
  document.querySelectorAll('.msg-btn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  STATE.selectedMsg = item;
  updatePreview();
}

function updatePreview() {
  const prev = document.getElementById('preview');
  const txt  = document.getElementById('preview-txt');
  const btn  = document.getElementById('btn-send');
  if (STATE.selectedMsg) {
    prev.classList.add('ready'); txt.textContent = STATE.selectedMsg.t; btn.disabled = false;
  } else {
    prev.classList.remove('ready'); txt.textContent = UI[STATE.lang].placeholder; btn.disabled = true;
  }
}

/* ══════════════════════════════
   SUPABASE
══════════════════════════════ */
function validateSupa() {
  if (!SUPA_URL || SUPA_URL.length < 5) return { ok:false, reason:'SUPA_URL non configurée.' };
  if (!SUPA_KEY || SUPA_KEY.length < 5) return { ok:false, reason:'SUPA_KEY non configurée.' };
  return { ok:true };
}

function setupPolling() {
  if (STATE.pollInterval) { clearInterval(STATE.pollInterval); STATE.pollInterval = null; }
  showPanel(); setPanel('loading', 'Vérification de la configuration…');
  const chk = validateSupa();
  if (!chk.ok) { setPanel('error_config', chk.reason); setDot('wait'); return; }
  setPanel('loading', 'Chargement du SDK Supabase…');
  if (!window.supabase) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    s.onload  = () => connectAndPoll();
    s.onerror = () => { setPanel('error_network', 'SDK Supabase inaccessible.'); setDot('wait'); };
    document.head.appendChild(s);
  } else { connectAndPoll(); }
}

async function connectAndPoll() {
  setPanel('loading', 'Connexion à Supabase…');
  try {
    STATE.supaClient = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data, error } = await STATE.supaClient.from('ponti_messages').select('id').limit(1);
    if (error) {
      const m = error.message || JSON.stringify(error);
      const isAuth = error.code==='PGRST301' || m.toLowerCase().includes('jwt') || m.toLowerCase().includes('apikey');
      setPanel(isAuth ? 'error_config' : 'error_network', (isAuth ? 'Auth refusée : ' : 'Erreur : ') + m);
      setDot('wait'); return;
    }
    setPanel('connected', 'Session : ' + STATE.conv);
    setDot('ok');
    document.getElementById('empty-txt').textContent = UI[STATE.lang].emptyReady;
    await loadHistory();
    STATE.pollInterval = setInterval(pollNew, 3000);
  } catch(e) {
    setPanel('error_network', 'Exception : ' + e.message); setDot('wait');
  }
}

async function loadHistory() {
  try {
    const { data, error } = await STATE.supaClient
      .from('ponti_messages').select('*').eq('conv_id', STATE.conv)
      .order('created_at', { ascending:true }).limit(100);
    if (error) { showPanel(); setPanel('error_query', 'Historique : ' + error.message); return; }
    if (data && data.length) {
      data.forEach(row => renderMsg(row, false));
      STATE.lastMsgId = data[data.length-1].id;
    }
  } catch(e) { showPanel(); setPanel('error_network', 'Historique : ' + e.message); }
}

async function pollNew() {
  if (!STATE.supaClient) return;
  try {
    let q = STATE.supaClient.from('ponti_messages').select('*')
      .eq('conv_id', STATE.conv).order('created_at', { ascending:true });
    if (STATE.lastMsgId) q = q.gt('id', STATE.lastMsgId);
    const { data, error } = await q;
    if (error) { console.warn('poll:', error.message); return; }
    if (data && data.length) {
      // N'afficher que les messages des autres — les nôtres sont déjà affichés optimistiquement
      data.forEach(row => { if (row.sender_id !== STATE.userId) renderMsg(row, true); });
      STATE.lastMsgId = data[data.length-1].id;
    }
  } catch(e) { console.warn('poll:', e.message); }
}

async function sendMessage() {
  if (!STATE.selectedMsg) return;
  const msg = STATE.selectedMsg;
  const row = {
    conv_id: STATE.conv,
    sender_id: STATE.userId,    // ← userId unique par onglet (sessionStorage)
    sender_name: STATE.name,
    sender_lang: STATE.lang,
    msg_id: msg.id,
    msg_text: msg.t
  };
  // Affichage optimiste immédiat
  renderMsg({ ...row, created_at: new Date().toISOString() }, false, true);
  STATE.selectedMsg = null;
  document.querySelectorAll('.msg-btn').forEach(b => b.classList.remove('sel'));
  updatePreview();
  if (!STATE.supaClient) { toast('⏳ Connexion en cours…'); return; }
  try {
    const { error } = await STATE.supaClient.from('ponti_messages').insert(row);
    if (error) {
      toast('❌ Envoi échoué : ' + (error.message||JSON.stringify(error)));
      showPanel(); setPanel('error_query', 'Insert refusé : ' + (error.message||''));
    }
  } catch(e) { toast('❌ ' + e.message); }
}

function renderMsg(row, animate, isMine) {
  const area  = document.getElementById('msgs');
  const empty = document.getElementById('empty-state');
  if (empty) empty.style.display = 'none';
  const mine = isMine !== undefined ? isMine : (row.sender_id === STATE.userId);

  // Traduction équivalente (pour messages reçus)
  let equiv = null;
  if (!mine && row.msg_id) {
    for (const cat of (MSG[STATE.lang] || MSG.fr)) {
      const item = cat.items.find(i => i.id === row.msg_id);
      if (item) { equiv = item.t; break; }
    }
  }

  const wrap = document.createElement('div');
  wrap.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
  if (!animate) wrap.style.animation = 'none';

  const bub = document.createElement('div');
  bub.className = 'bubble'; bub.textContent = row.msg_text;
  wrap.appendChild(bub);

  if (equiv && !mine) {
    const eq = document.createElement('div');
    eq.className = 'equiv'; eq.textContent = '↳ ' + equiv;
    wrap.appendChild(eq);
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const time = new Date(row.created_at).toLocaleTimeString(STATE.lang, {hour:'2-digit',minute:'2-digit'});
  meta.textContent = (mine ? (UI[STATE.lang].youSent || 'Vous') : (row.sender_name||'')) + ' · ' + time;
  wrap.appendChild(meta);

  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

/* ══════════════════════════════
   UI HELPERS
══════════════════════════════ */
function setDot(s) {
  const d = document.getElementById('conn-dot');
  d.className = 'conn-dot ' + (s==='ok' ? 'ok' : 'wait');
}

function setPanel(state, detail) {
  const panel = document.getElementById('conn-panel');
  const retry = document.getElementById('conn-retry');
  panel.className = 'conn-panel ' + state;
  panel.classList.remove('hide');
  retry.style.display = 'none';
  const labels = {
    loading:      { ico:'⏳', tit:'Connexion en cours…' },
    connected:    { ico:'✅', tit:'Connecté' },
    error_config: { ico:'⚙️', tit:'Erreur de configuration' },
    error_network:{ ico:'📡', tit:'Erreur réseau' },
    error_query:  { ico:'⚠️', tit:'Erreur de requête' },
  };
  const l = labels[state] || labels.error_query;
  document.getElementById('conn-ico').textContent   = l.ico;
  document.getElementById('conn-title').textContent = l.tit;
  document.getElementById('conn-msg').textContent   = detail||'';
  if (state.startsWith('error')) retry.style.display = 'inline-flex';
  if (state === 'connected') {
    setTimeout(() => { panel.classList.add('hide'); }, 3000);
  }
}
function showPanel() {
  const p = document.getElementById('conn-panel');
  p.classList.remove('hide');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

/* BOOT */
boot();
</script>
